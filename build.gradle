plugins {
    id 'fabric-loom' version '1.1-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extra {
    apply plugin: 'fabric-loom'
    loom {
        minecraftVersion = '1.20.4'
        mappings = '1.20.4+build.1'
        runDir = 'run'
        version = '1.0.0'
        modId = 'ironmanarmormod'
        accessWidener = 'src/main/resources/ironmanarmormod.accesswidener'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.4'
    mappings 'net.fabricmc:yarn:1.20.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.21'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.82.0+1.20.4'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraftVersion
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand(project.properties)
    }
    into 'build/resources/main'
}
